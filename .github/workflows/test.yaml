name: Linting and deployment test on K3S

on:
  push:
    branches: [master, dev]
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}  # Allow calling from release workflow

permissions:
  contents: read
  pull-requests: read

jobs:
  linting:
    runs-on: gcp-runner
    steps:
      - name: Install Kubectl
        run: curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl && kubectl version || true

      - name: Install Helm
        id: install-helm
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
          fi
          helm version

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Helm linting for galaxy
        run: helm lint galaxy/

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check rendered reference-data integration
        run: |
          python -m pip install PyYAML
          python -m unittest discover -s tests -v

  test:
    runs-on: gcp-runner
    name: test (${{ matrix.mode }})
    concurrency:
      group: galaxy-helm-test-${{ matrix.mode }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default chart config is a multi-user Galaxy instance.
          - mode: multi-user
            namespace: galaxy-multi-user
            release: galaxy-multi-user
            node_port: 30700
            extra_args: ""
          # single_user pins Galaxy to a single user instance.
          - mode: single-user
            namespace: galaxy-single-user
            release: galaxy-single-user
            node_port: 30701
            extra_args: "--set 'configs.galaxy\\.yml.galaxy.single_user=admin@galaxy.org'"
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # Remove large preinstalled toolchains we don't need; the K3S node
          # only has ~14GB otherwise, and pulling the Galaxy images plus
          # provisioning PVs pushes it into ephemeral-storage pressure.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Install Helm
        id: install-helm
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/master/scripts/get-helm-3 | bash
          fi
          helm version

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start k8s locally
        uses: jupyterhub/action-k3s-helm@v4
        with:
          k3s-version: v1.34.7+k3s1 # releases:  https://github.com/k3s-io/k3s/tags
          metrics-enabled: false
          traefik-enabled: false
      - name: Verify function of k8s, kubectl, and helm
        run: |
          echo "kubeconfig: $KUBECONFIG"
          kubectl version
          kubectl get pods --all-namespaces

          helm version
          helm list
      - name: Helm repo add galaxy
        run: |
          helm repo add galaxy https://github.com/CloudVE/helm-charts/raw/master --force-update
          helm repo update galaxy
      - name: Helm install galaxy-helm-deps
        run: |
          time bash -c '
            TARGET_CHART="galaxy-deps-$(helm search repo galaxy/galaxy-deps -o json | jq -r ".[0].version")"
            echo "Target galaxy-deps chart: ${TARGET_CHART}"
            for attempt in $(seq 1 60); do
              RELEASE_JSON=$(helm list --all -n galaxy-deps -f "^galaxy-deps$" -o json 2>/dev/null || echo "[]")
              STATUS=$(echo "$RELEASE_JSON" | jq -r ".[0].status // \"\"")
              INSTALLED_CHART=$(echo "$RELEASE_JSON" | jq -r ".[0].chart // \"\"")
              if [[ "$STATUS" == "deployed" && "$INSTALLED_CHART" == "$TARGET_CHART" ]]; then
                echo "galaxy-deps is already deployed with ${INSTALLED_CHART}"
                exit 0
              elif [[ "$STATUS" == pending-* ]]; then
                echo "Another job is currently installing/upgrading galaxy-deps (status=${STATUS}); waiting 10s..."
                sleep 10
                continue
              fi
              if helm upgrade --install --create-namespace --wait -n "galaxy-deps" "galaxy-deps" galaxy/galaxy-deps \
                --set cvmfs.cvmfscsi.cache.alien.enabled=false --timeout=1200s; then
                exit 0
              fi
              echo "Concurrent galaxy-deps operation detected; retrying in 10s..."
              sleep 10
            done
            exit 1
          '
      - name: Helm install Galaxy (${{ matrix.mode }})
        run: |
          helm uninstall ${{ matrix.release }} -n ${{ matrix.namespace }} --wait --timeout=120s 2>/dev/null || true
          kubectl delete ns ${{ matrix.namespace }} --wait=true --timeout=120s --ignore-not-found=true 2>/dev/null || true
          kubectl delete priorityclass ${{ matrix.release }}-job-priority --ignore-not-found=true 2>/dev/null || true
          time helm install --create-namespace -n ${{ matrix.namespace }} ${{ matrix.release }} ./galaxy \
            --set persistence.accessMode="ReadWriteOnce" \
            --set resources.requests.memory=0Mi,resources.requests.cpu=0m \
            --set refdata.enabled=false \
            --set service.nodePort=${{ matrix.node_port }} \
            ${{ matrix.extra_args }} \
            --wait --timeout=1200s
      - name: Get events
        run: kubectl get events -n ${{ matrix.namespace }}; kubectl get events -n csi-drivers;
        if: always()
      - name: Get pods, pvc, and pv
        run: kubectl get pods -n ${{ matrix.namespace }}; kubectl get pvc -n ${{ matrix.namespace }}; kubectl get pv
        if: always()
      - name: Print handler logs
        run: |
          echo "=== Collecting Galaxy handler logs ==="
          for handler in web job workflow; do
            echo "--- ${handler} handler logs ---"
            POD_NAME=$(kubectl get pods -n ${{ matrix.namespace }} -l "app.kubernetes.io/component=galaxy-${handler}-handler" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [[ -n "$POD_NAME" ]]; then
              echo "Pod: $POD_NAME"
              kubectl logs -n ${{ matrix.namespace }} "$POD_NAME" --tail=100 || echo "Failed to get logs for $POD_NAME"
            else
              # Fallback to old method if label selector doesn't work
              POD_NAME=$(kubectl get pods -n ${{ matrix.namespace }} -o name | grep "galaxy-${handler}" | head -1 | cut -d/ -f2 2>/dev/null || echo "")
              if [[ -n "$POD_NAME" ]]; then
                echo "Pod (fallback): $POD_NAME"
                kubectl logs -n ${{ matrix.namespace }} "$POD_NAME" --tail=100 || echo "Failed to get logs for $POD_NAME"
              else
                echo "No ${handler} handler pod found"
              fi
            fi
            echo ""
          done
        if: always()
      - name: Check appVersion
        if: always()
        run: |
          kubectl get svc -n ${{ matrix.namespace }}
          kubectl describe svc -n ${{ matrix.namespace }} ${{ matrix.release }}-nginx
          appVersion=$(cat galaxy/Chart.yaml | grep ^appVersion: | awk '{print $2}' | tr -d '"')
          address=$(kubectl get svc -n ${{ matrix.namespace }} ${{ matrix.release }}-nginx -o jsonpath="http://{.spec.clusterIP}:{.spec.ports[0].port}/galaxy/api/version")
          echo "Address is $address"
          apiVersion=$(curl $address | jq -r '"\(.version_major).\(.version_minor)"')
          echo "appVersion: $appVersion"
          echo "apiVersion: $apiVersion"
          if [ "$appVersion" != "$apiVersion" ]; then
            exit 1
          fi
      - name: Cleanup Galaxy (${{ matrix.mode }})
        if: always()
        run: |
          helm uninstall ${{ matrix.release }} -n ${{ matrix.namespace }} --wait --timeout=120s || true
          kubectl delete ns ${{ matrix.namespace }} --wait=true --timeout=120s --ignore-not-found=true || true
          kubectl delete priorityclass ${{ matrix.release }}-job-priority --ignore-not-found=true || true
