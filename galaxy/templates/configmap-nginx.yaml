{{- /*
The override is interpolated straight into an nginx `map` directive, so an
unusable value (a stray semicolon, an extra word) renders a config nginx cannot
parse and galaxy-nginx crash-loops with the reason buried in pod logs. Reject it
here instead, while the operator is still looking at a helm command.
*/ -}}
{{- with .Values.nginx.conf.forwardedProtoOverride }}
{{- if not (has . (list "http" "https")) }}
{{- fail (printf "nginx.conf.forwardedProtoOverride must be \"http\" or \"https\", got %q" .) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "galaxy.fullname" . }}-nginx-conf
  labels:
    {{- include "galaxy.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes  4;

    events {
        worker_connections  1024;
    }

    http {
        default_type  application/octet-stream;
        include /etc/nginx/mime.types;
        sendfile        on;
        keepalive_timeout  65;
        index   index.html index.php index.htm;

        gzip  on;
        gzip_http_version 1.1;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;
        gzip_buffers 16 8k;
        proxy_read_timeout 600;
        client_max_body_size {{ .Values.nginx.conf.client_max_body_size }};

        map $http_x_forwarded_proto $proxy_x_forwarded_proto {
          default {{ .Values.nginx.conf.forwardedProtoOverride | default "$http_x_forwarded_proto" }};
          '' {{ .Values.nginx.conf.forwardedProtoOverride | default "$scheme" }};
        }

        server {
            listen {{ .Values.nginx.containerPort }};
            server_name galaxy;

            location {{ template "galaxy.add_trailing_slash" .Values.ingress.path }}static {
                alias {{ .Values.nginx.galaxyStaticDir }};
                expires 24h;
            }

            location {{ template "galaxy.add_trailing_slash" .Values.ingress.path }} {
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
                proxy_set_header X-Url-Scheme $proxy_x_forwarded_proto;
                proxy_set_header Upgrade $http_upgrade;
                proxy_pass http://{{ template "galaxy.fullname" . }}-galaxy:8080;
            }

            location ^~ {{ template "galaxy.add_trailing_slash" .Values.ingress.path }}admin_toolshed/static {
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
                proxy_set_header X-Url-Scheme $proxy_x_forwarded_proto;
                proxy_set_header Upgrade $http_upgrade;
                proxy_pass http://{{ template "galaxy.fullname" . }}-galaxy:8080;
                expires 24h;
            }

            location ~ ^{{ template "galaxy.add_trailing_slash" .Values.ingress.path }}api/dataset_collections/([^/]+)/download/?$ {
                proxy_buffering off;
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
                proxy_set_header X-Url-Scheme $proxy_x_forwarded_proto;
                proxy_set_header Upgrade $http_upgrade;
                proxy_pass http://{{ template "galaxy.fullname" . }}-galaxy:8080;
            }

            location {{ template "galaxy.add_trailing_slash" .Values.ingress.path }}_x_accel_redirect/ {
                internal;
                alias /;
                add_header X-Frame-Options SAMEORIGIN;
                add_header X-Content-Type-Options nosniff;
            }
{{- with trimSuffix "/" .Values.ingress.path }}

            # Galaxy releases without the fix from galaxyproject/galaxy#23274
            # double the URL prefix in the post-login redirect ({{ . }}{{ . }}/...).
            # Collapse the duplicated prefix until that fix ships in a tagged release.
            location {{ . }}{{ . }}/ {
                absolute_redirect off;
                rewrite ^{{ . }}(.*)$ $1 redirect;
            }
{{- end }}
{{- if .Values.trainingHook.enabled }}
            location /training-material/ {
                proxy_pass {{ .Values.trainingHook.url }};
                proxy_ssl_server_name on;
            }
{{- end }}

        # end server
        }
    # end http
    }
