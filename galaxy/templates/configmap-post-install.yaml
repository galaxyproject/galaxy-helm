{{- if .Values.postInstallJob.enabled }}
{{- $galaxyUrl := include "galaxy.internalUrl" . -}}
{{- $masterKey := .Values.configs | dig "galaxy.yml" "galaxy" "master_api_key" (.Values.configs | dig "galaxy.yml" "galaxy" "bootstrap_admin_api_key" "") -}}
{{- $singleUser := .Values.configs | dig "galaxy.yml" "galaxy" "single_user" "" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "galaxy.fullname" . }}-post-install
  labels:
    {{- include "galaxy.labels" . | nindent 4 }}
data:
  bootstrap.yaml: |
{{- .Values.postInstallJob.bootstrapConfig | nindent 4 }}
  post-install.sh: |
    #!/bin/bash
    set -e

    # Wait for Galaxy to be ready. -f is required: without it curl exits 0 on a 404,
    # so a misrouted URL would satisfy this loop and fail confusingly further down.
    echo "Waiting for Galaxy to be ready at {{ $galaxyUrl }}/api/version ..."
    until curl -sf "{{ $galaxyUrl }}/api/version" > /dev/null; do
      echo "Galaxy not ready yet, waiting..."
      sleep 10
    done
    for deployment in $(kubectl get deployments -n galaxy | grep galaxy | awk '{print $1}') ; do
      kubectl rollout status deployment/$deployment -n galaxy --watch --timeout={{ .Values.postInstallJob.rolloutTimeout | default "20m" }}
    done
    echo "Galaxy is ready!"

    echo "Configuring ABM"
    mkdir -p ~/.abm
    cat > ~/.abm/profile.yml <<PROFILE
    galaxy:
      url: $GALAXY_URL
      key: $GALAXY_MASTER_KEY
    PROFILE
    
    # Get/create an API key for the Galaxy user
    {{- if $singleUser }}
    # Single-user - hitting the url causes the web handler to create the default user.
    echo "Single user instance. User is $GALAXY_USER"
    # Trailing slash matters: without it nginx answers 301 and curl (no -L) would
    # exit 0 without ever reaching Galaxy, so the user would not be created.
    curl -fsSL {{ $galaxyUrl }}/ > /dev/null
    USER_KEY=$(abm galaxy user key $GALAXY_USER)
    {{- else }}
    # Multi-user Galaxy instance - create user and get their key
    echo "Multi user instance. User is $GALAXY_USER"    
    USERNAME=$(echo "$GALAXY_USER" | cut -d'@' -f1)
    USER_KEY=$(abm galaxy user create $USERNAME $GALAXY_USER $GALAXY_MASTER_KEY | jq -r .key)
    {{- end }}
    # Without a real user key ABM silently falls back to the master key, which makes
    # Galaxy return 500 on user-scoped endpoints instead of a usable error.
    if [ -z "$USER_KEY" ]; then
      echo "ERROR: no API key obtained for $GALAXY_USER; cannot bootstrap." >&2
      exit 1
    fi
    abm config key galaxy $USER_KEY
    
    # Run bootstrap configuration
    echo "Starting ABM bootstrap configuration..."
    abm config bootstrap galaxy /tmp/bootstrap.yaml
    echo "Bootstrap configuration completed successfully!"
{{- end }}