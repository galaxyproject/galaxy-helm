{{- if and .Values.tusd.enabled .Values.gateway.enabled -}}
{{- $fullName := include "galaxy.fullname" . -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-tusd
  labels:
    {{- include "galaxy.labels" . | nindent 4 }}
  {{- with .Values.gateway.httpRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "galaxy.gateway.parentRefs" . | trim | nindent 2 }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    {{- range .Values.tusd.ingress.hosts }}
    {{- range .paths }}
    - matches:
        - path:
            #- Overridable per path, but defaults to PathPrefix: tusd serves the creation
            #- POST on the base path and every PATCH/HEAD for a given upload on
            #- `<base path>/<upload id>`, so Exact matches only the POST and silently
            #- breaks resumable uploads. PathPrefix matches on path element boundaries,
            #- so it will not match unrelated paths that merely share the prefix string.
            type: {{ .type | default "PathPrefix" }}
            value: {{ tpl .path $ }}
      backendRefs:
        - name: {{ $fullName }}-tusd
          port: 1080
      filters:
        # Disable buffering for resumable uploads
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Connection
                value: Upgrade
        {{- if $.Values.gateway.tusd.extraFilters }}
        {{- toYaml $.Values.gateway.tusd.extraFilters | nindent 8 }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
